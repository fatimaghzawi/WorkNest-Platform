services:
  - type: web
    name: worknest-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: WorkNest
      - key: APP_URL
        value: https://worknest-platform.onrender.com
      - key: CLIENT_URL
        value: https://work-nest-platform-nu.vercel.app
      # Required secrets (set in Render dashboard):
      # MONGO_URI, JWT_SECRET, JWT_REFRESH_SECRET,
      # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
      # ELASTICEMAIL_API_KEY (or SENDGRID_API_KEY / SMTP),
      # EMAIL_FROM, GOOGLE_CLIENT_ID, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
      # Note: local uploads/ is ephemeral on Render — use object storage for durable files.
